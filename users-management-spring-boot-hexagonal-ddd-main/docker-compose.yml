version: '3.8'

services:
  user-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Las credenciales reemplazan las propiedades fijas de tu application.properties
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=crud_usuarios
      - DB_USERNAME=root
      - DB_PASSWORD=123
    depends_on:
      mysql-db:
        condition: service_healthy

  mysql-db:
    container_name: mysql-db
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=crud_usuarios
      - MYSQL_ROOT_PASSWORD=123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5